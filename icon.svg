  </defs>
  <rect x="0" y="0" width="36" height="36" rx="9" fill="#2b282e"/>
  <rect x="3" y="12.5" width="30" height="11" rx="5.5" fill="url(#track)"/>
  <g clip-path="url(#capsule)">
    <rect x="3" y="12.5" width="30" height="11" fill="url(#gloss)"/>
    <circle cx="9" cy="15.6" r="0.55" fill="#ffffff" opacity="0.95"/>
    <circle cx="14.5" cy="18.8" r="0.45" fill="#ffffff" opacity="0.8"/>
    <circle cx="19" cy="15.2" r="0.65" fill="#ffffff" opacity="0.9"/>
    <circle cx="23.5" cy="19.4" r="0.4" fill="#ffffff" opacity="0.7"/>
    <circle cx="27" cy="16" r="0.5" fill="#ffffff" opacity="0.85"/>
  </g>
  <circle cx="30.5" cy="18" r="4.4" fill="#ffffff"/>
  <circle cx="30.5" cy="18" r="5.6" fill="none" stroke="#c4b5fd" stroke-opacity="0.55"/>
</svg>
