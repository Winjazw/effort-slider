<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" role="img" aria-label="Reasoning effort slider">
  <defs>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4566ea"/>
      <stop offset="0.4" stop-color="#6560dd"/>
      <stop offset="0.72" stop-color="#7a55cf"/>
      <stop offset="1" stop-color="#8a55d6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="capsule">
      <rect x="3" y="12.5" width="30" height="11" rx="5.5"/>
